<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout cancelled — Alhabashi</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: #EAF4FC;
    color: #1B2A41;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    background: #FFFFFF;
    border: 1px solid #BFE0F5;
    border-radius: 12px;
    padding: 40px 32px;
    max-width: 420px;
  }
  h1 {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 12px;
  }
  p { color: #55697C; }
  a.btn {
    display: inline-block;
    margin-top: 24px;
    background: #2E7DC9;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Checkout cancelled</h1>
    <p>Your cart is still saved — no charge was made.</p>
    <a class="btn" href="/">Back to shop</a>
  </div>
</body>
</html>
